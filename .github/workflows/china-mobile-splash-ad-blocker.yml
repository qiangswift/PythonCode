name: Build China Mobile Splash Ad Blocker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "iOS17_dylib/ChinaMobileSplashAdBlocker/**"
      - ".github/workflows/china-mobile-splash-ad-blocker.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build rootless deb
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot git libplist-utils perl rsync xz-utils

      - name: Install Theos, toolchain, and iOS SDK
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          curl -fsSL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            | tar -xJf - -C "$THEOS/toolchain/"
          git clone --depth 1 https://github.com/theos/sdks.git "${{ runner.temp }}/ios-sdks"
          cp -a "${{ runner.temp }}/ios-sdks/." "$THEOS/sdks/"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"

      - name: Build package
        working-directory: iOS17_dylib/ChinaMobileSplashAdBlocker
        env:
          THEOS: ${{ runner.temp }}/theos
          THEOS_PACKAGE_SCHEME: rootless
        run: make clean package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: ChinaMobileSplashAdBlocker-rootless
          path: iOS17_dylib/ChinaMobileSplashAdBlocker/packages/*.deb
          if-no-files-found: error

  build-roothide:
    name: Build RootHide deb
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install RootHide Theos
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos-roothide
          submodules: recursive
      - run: brew install ldid xz
      - name: Build RootHide package
        working-directory: iOS17_dylib/ChinaMobileSplashAdBlocker
        env:
          THEOS: ${{ github.workspace }}/theos-roothide
          THEOS_PACKAGE_SCHEME: roothide
        run: make clean package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: ChinaMobileSplashAdBlocker-roothide
          path: iOS17_dylib/ChinaMobileSplashAdBlocker/packages/*.deb
          if-no-files-found: error
