name: Build QDReader Auto Checkin RootHide
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["iOS17_dylib/QDReaderAutoCheckin/**", ".github/workflows/qdreader-auto-checkin-roothide.yml"]
permissions:
  contents: read
jobs:
  build-roothide:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos-roothide
          submodules: recursive
      - run: brew install ldid xz
      - working-directory: iOS17_dylib/QDReaderAutoCheckin
        env:
          THEOS: ${{ github.workspace }}/theos-roothide
          THEOS_PACKAGE_SCHEME: roothide
        run: make clean package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: QDReaderAutoCheckin-roothide
          path: iOS17_dylib/QDReaderAutoCheckin/packages/*.deb
          if-no-files-found: error
