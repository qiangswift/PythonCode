name: Build QDReader Auto Check-in

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    paths:
      - 'iOS17_dylib/QDReaderAutoCheckin/**'
      - '.github/workflows/qdreader-auto-checkin.yml'

jobs:
  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        variant: [rootfull, rootless, roothide]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install ldid make xz
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
          curl -fsSL https://github.com/theos/sdks/archive/master.tar.gz | tar -xz --strip-components=1 -C "$HOME/theos/sdks"
      - name: Build ${{ matrix.variant }}
        working-directory: iOS17_dylib/QDReaderAutoCheckin
        run: |
          export THEOS="$HOME/theos"
          if [ "${{ matrix.variant }}" = rootfull ]; then
            make clean package FINALPACKAGE=1 ARCHS=arm64
          else
            make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME="${{ matrix.variant }}" ARCHS=arm64
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: QDReaderAutoCheckin-${{ matrix.variant }}
          path: iOS17_dylib/QDReaderAutoCheckin/packages/*.deb
