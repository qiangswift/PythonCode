name: Build Reeder Portrait Lock RootHide
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["iOS17_dylib/ReederPortraitLock/**", ".github/workflows/reeder-portrait-lock-roothide.yml"]
permissions:
  contents: read
jobs:
  build-roothide:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos-roothide
          submodules: recursive
      - run: brew install ldid xz
      - working-directory: iOS17_dylib/ReederPortraitLock
        env:
          THEOS: ${{ github.workspace }}/theos-roothide
          THEOS_PACKAGE_SCHEME: roothide
        run: make clean package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: ReederPortraitLock-roothide
          path: iOS17_dylib/ReederPortraitLock/packages/*.deb
          if-no-files-found: error
