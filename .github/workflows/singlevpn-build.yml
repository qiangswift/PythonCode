name: Build SingleVPN Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "iOS17_dylib/SingleVPN/**"
      - ".github/workflows/singlevpn-build.yml"

env:
  VERSION: 1.0
  FINALPACKAGE: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Setup Environment
        run: |
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "THEOS_IGNORE_PARALLEL_BUILDING_NOTICE=yes" >> $HOME/.theosrc

      - name: Setup Theos
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/OwnGoalStudio/theos/master/bin/install-theos)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Environment (RootHide)
        run: |
          echo "THEOS=$HOME/theos-roothide" >> $GITHUB_ENV

      - name: Setup Theos (RootHide)
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/OwnGoalStudio/theos-roothide/master/bin/install-theos)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix devkit script permissions
        run: |
          chmod +x iOS17_dylib/SingleVPN/devkit/*.sh

      - name: Build (arm)
        working-directory: iOS17_dylib/SingleVPN
        run: |
          source devkit/env.sh
          make package

      - name: Build (arm64 rootless)
        working-directory: iOS17_dylib/SingleVPN
        run: |
          source devkit/rootless.sh
          make package

      - name: Build (arm64e roothide)
        working-directory: iOS17_dylib/SingleVPN
        run: |
          source devkit/roothide.sh
          make package

      - name: Collect packages
        run: |
          mkdir -p packages
          find iOS17_dylib/SingleVPN/packages -type f -name "*.deb" -exec cp {} packages/ \;
          find iOS17_dylib/SingleVPN/.theos/obj -name "*.dSYM" -exec cp -r {} ./packages/ \;
          test -n "$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)" || { echo "No .deb packages were produced"; exit 1; }
          ROOTLESS_DEB=$(find packages -maxdepth 1 -type f -name '*_iphoneos-arm64.deb' -print -quit)
          test -n "$ROOTLESS_DEB" || { echo "No rootless .deb package was produced"; exit 1; }
          tar -tf "$ROOTLESS_DEB" | grep -qx 'data.tar.gz' || { echo "Rootless package is not using gzip compression"; exit 1; }
          VERSION=$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit | sed -E 's/.*_([^_]+)_[^_]+\.deb/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Upload dSYMs
        uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ env.VERSION }}
          path: |
            ./packages/*.dSYM

      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: SingleVPN-${{ env.VERSION }}-deb
          path: |
            ./packages/*.deb
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          draft: true
          files: |
            ./packages/*.deb
