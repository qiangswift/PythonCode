name: Build Telegram System DNS

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    paths:
      - 'iOS17_dylib/TelegramSystemDNS/**'
      - '.github/workflows/telegram-system-dns.yml'

jobs:
  build-rootless:
    name: Build rootless deb
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot git libplist-utils perl rsync xz-utils
      - name: Install Theos, toolchain, and iOS SDK
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          curl -fsSL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            | tar -xJf - -C "$THEOS/toolchain/"
          git clone --depth 1 https://github.com/theos/sdks.git "${{ runner.temp }}/ios-sdks"
          cp -a "${{ runner.temp }}/ios-sdks/." "$THEOS/sdks/"
      - name: Build rootless
        working-directory: iOS17_dylib/TelegramSystemDNS
        env:
          THEOS: ${{ runner.temp }}/theos
          THEOS_PACKAGE_SCHEME: rootless
        run: make clean package FINALPACKAGE=1 ARCHS=arm64
      - uses: actions/upload-artifact@v4
        with:
          name: TelegramSystemDNS-rootless
          path: iOS17_dylib/TelegramSystemDNS/packages/*.deb
          if-no-files-found: error

  build-roothide:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install ldid make xz
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
          curl -fsSL https://github.com/theos/sdks/archive/master.tar.gz | tar -xz --strip-components=1 -C "$HOME/theos/sdks"
      - name: Build roothide
        working-directory: iOS17_dylib/TelegramSystemDNS
        run: |
          export THEOS="$HOME/theos"
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide ARCHS=arm64
      - uses: actions/upload-artifact@v4
        with:
          name: TelegramSystemDNS-roothide
          path: iOS17_dylib/TelegramSystemDNS/packages/*.deb
